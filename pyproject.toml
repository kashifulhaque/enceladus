[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "enceladus"
version = "0.1.0.dev0"
description = "A Triton-like tile language for Apple GPUs that compiles Python kernels to Metal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26", "ml_dtypes>=0.4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/kashifulhaque/enceladus"
Documentation = "https://github.com/kashifulhaque/enceladus/blob/main/docs/guide/index.md"
Issues = "https://github.com/kashifulhaque/enceladus/issues"

[project.optional-dependencies]
torch = ["torch>=2.5"]
mlx = ["mlx>=0.20"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.5", "mlx>=0.20"]

[tool.scikit-build]
wheel.packages = ["src/enceladus"]
wheel.exclude = ["enceladus/_C/*.mm", "enceladus/_C/*.h"]
sdist.exclude = [".claude/", ".github/", "docs/research/", "benchmarks/results/"]
cmake.build-type = "Release"
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = "15.0"

[tool.scikit-build.env]
MACOSX_DEPLOYMENT_TARGET = "15.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take more than a few seconds"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
# The research prototypes are read-only reference code.
extend-exclude = ["docs/research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Benchmarks define timing closures inside loops and call them in the same iteration.
"benchmarks/*" = ["B023"]
