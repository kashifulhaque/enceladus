# Builds the macOS arm64 wheels and the sdist, and publishes them to PyPI on every push
# to main.
#
# The published version is MAJOR.MINOR from pyproject.toml plus the number of commits on
# main, for example 0.1.42, so each push gets a new version without a manual bump.

name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publish pushes in order; a later push waits for the earlier one instead of racing it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    name: Compute the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          version="$(echo "$base" | cut -d. -f1-2).$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

  wheels:
    name: Wheel for Python ${{ matrix.python }}
    needs: version
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Set the version
        run: sed -i '' "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Build the wheel
        run: uv build --wheel --python ${{ matrix.python }} --out-dir dist

      - name: Check the wheel name
        run: |
          name="enceladus-$VERSION-cp${PY/./}-cp${PY/./}-macosx_15_0_arm64.whl"
          ls dist/*.whl
          test -f "dist/$name" || { echo "::error::expected dist/$name"; exit 1; }
        env:
          PY: ${{ matrix.python }}

      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --python ${{ matrix.python }} \
            --with "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" \
            python "$GITHUB_WORKSPACE/scripts/smoke_test.py" "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Set the version
        run: sed -i '' "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      # Without --sdist, uv also builds a wheel from the sdist, which checks that the
      # sdist has every file the build needs.
      - name: Build the sdist and a wheel from it
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List the distributions
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A rerun of a published commit skips files that are already on PyPI.
          skip-existing: true
