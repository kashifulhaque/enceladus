# Builds the macOS arm64 wheels and the sdist, and publishes them to PyPI.
#
# A push of a tag like v0.1.0 builds and publishes. The tag must match the version in
# pyproject.toml. Running the workflow by hand builds and tests without publishing.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel for Python ${{ matrix.python }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel --python ${{ matrix.python }} --out-dir dist

      - name: Check the wheel tag
        run: |
          tag="cp${PY/./}-cp${PY/./}-macosx_15_0_arm64"
          ls dist/*.whl
          test -f dist/enceladus-*-"$tag".whl || { echo "::error::no $tag wheel"; exit 1; }
        env:
          PY: ${{ matrix.python }}

      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --python ${{ matrix.python }} \
            --with "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" \
            python "$GITHUB_WORKSPACE/scripts/smoke_test.py"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Without --sdist, uv also builds a wheel from the sdist, which checks that the
      # sdist has every file the build needs.
      - name: Build the sdist and a wheel from it
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the distributions
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
